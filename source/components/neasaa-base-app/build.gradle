apply plugin: 'jacoco'

jar {
    archiveBaseName.set('neasaa-base-app')
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, include: 'com/neasaa/base/app/utils/**')
        }))
    }
}

dependencies {
    api libraries.springFramework
    implementation libraries.springLogger
    api libraries.log4j
    api libraries.neasaaUtils
    implementation libraries.bouncycastleProvider
    api libraries.jackson
    api libraries.email
    implementation libraries.jdbcLibs
    implementation libraries.jasypt
    testImplementation libraries.unitTest
}

eclipse {
    def repoSource = "${rootDir.path}"
    // Fix windows directory delimiters
    repoSource = repoSource.replaceAll( "\\\\", "/" )

    project {
        name = 'neasaa-base-app'
    }
}
